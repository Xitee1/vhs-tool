# vhs-tool configuration
#
# Place this file as `vhs-tool.toml` in the directory you run vhs-tool from
# (the pipeline root), or point $VHS_TOOL_CONFIG at it.
#
# Every key is optional — the values shown are the built-in defaults.
# Uncomment and edit only what differs on your setup.

[paths]
# Directories searched (depth 3) for RF capture files
#captures = ["./captures", "./export_new"]
#decoded = "./decoded"
#export = "./export"
#final = "./final"
#upload = "./upload"
#tools = "./tools"
# Overrides for the packaged Jinja2 templates (notes.txt.j2,
# youtube_description.txt.j2) — copy a template here to customize it
#templates = "./templates"

[binaries]
#vhs_decode = "./tools/vhs-decode/.venv/bin/vhs-decode"
#hifi_decode = "./tools/vhs-decode/.venv/bin/hifi-decode"
#aaa = "./tools/vhs-decode-aaa-1.0.2-x86_64.appimage"
#tbc_video_export = "./tools/tbc-video-export.AppImage"
#tbc_tools = "./tools/tbc-tools/tbc-tools-x86_64.AppImage"
#tbc_export_config = "./tools/tbc-video-export.json"
# ali1234/vhs-teletext — used by `vhs-tool process-teletext`
#teletext = "./tools/vhs-decode/.venv/bin/teletext"
# namazso/cxadc_vhs_server — used by `vhs-tool capture`
#cxadc_server = "./tools/Scripts/clockgen scripts/cxadc_vhs_server"

[defaults]
# Audio language code for muxing
#lang = "de"
# pal | ntsc | pal-m | ntsc-j | mesecam
#tv_system = "pal"
# vhs | vhshq | svhs | umatic | ...
#tape_format = "vhs"
# G0 national subset `process-teletext` renders the html pages with — a charset
# key your vhs-teletext knows (see `teletext html --help`), e.g. "ger" for German
# umlauts. Empty leaves it to vhs-teletext, which assumes English.
#teletext_language = ""
# Notes.txt "Extra parameters" prompt default
#extra_decode_params = "--ire0_adjust"
# Notes.txt version fallback when not detectable from decode artifacts
#vhs_decode_version = "v0.4.0"

# `vhs-tool capture` defaults and pre-flight target values
[capture]
# CX card numbers (clockgen wiring: clock output N feeds card N)
#video_card = 0
#hifi_card = 1
# ALSA device for linear+headswitch ("" = cxadc_vhs_server default)
#linear_device = ""
#linear_rate = 46875
# The one source of truth for the CX sample rate: drives the FLAC header rate
# (1000:1), the clockgen pre-flight check, and the HiFi resample ratio
#capture_rate = 40000000
#hifi_resample_rate = 10000000
# FLAC compression level 0-8 (8 is optimal for RF; 9+ would bloat the files)
#flac_level = 8
# FLAC encoder threads; 0 = auto (all cores, needs flac >= 1.5)
#flac_threads = 0
# Pre-flight: expected /sys/class/cxadc/cxadc<N>/device/parameters values
#cxadc_vmux = 0
#cxadc_level = 0
#cxadc_sixdb = 0
#cxadc_tenxfsc = 0
#cxadc_tenbit = 0
# Pre-flight: clockgen ALSA device for the amixer rate check, and which
# clockgen output is wired to which card
#clockgen_device = "hw:CARD=CXADCADCClockGe"
#clockgen_video_out = 0
#clockgen_hifi_out = 1
# Pre-flight: resources (the server allocates a 1 GiB ring buffer per card)
#min_free_disk_gib = 400.0
#ram_headroom_gib = 1.0

# Capture hardware description — verbatim text for Notes.txt
[hardware]
#vcr = "Panasonic NV-VP30"
#rf_capture = "CX25800 (Video) + CX23883 (HiFi), Clockgen 40 MSPS"
#rf_amp = "ADA4857 (4S 18650 Li-Ion)"
#rf_amp_video = "R11/R12 = 15kΩ, R13 = 120Ω, R14 = 560Ω"
#rf_amp_hifi = "R21/R22 = 20kΩ, R23 = 390Ω, R24 = 560Ω"
#audio_adc = "PCM1802 (Clockgen)"

[links]
# Static footer appended to the YouTube description
#youtube = """
#VHS-Decode Wiki: https://github.com/oyvindln/vhs-decode/wiki/
#VHS-Decode Reddit: https://www.reddit.com/r/vhsdecode/
#Domesday86 Discord: https://discord.gg/pVVrrxd"""

[upload]
# VapourSynth filter scripts copied into the IA item for reproducibility
#pipeline_files = ["vapoursynth_vhs.vpy"]
